---
jobs:
  - name: build-ci-images
    plan:
      - get: weekly
        trigger: true
      - get: ci-images-git-repo
        trigger: true
      - task: generate-docker-credentials
        file: ci-images-git-repo/ci/tasks/generate-docker-credentials.yml
        input_mapping:
          git-repo: ci-images-git-repo
        vars:
          registry: ((app-broker-virtual-docker-registry))
          registry-username: ((broadcom-jfrog-artifactory-robot-account.username))
          registry-password: ((broadcom-jfrog-artifactory-robot-account.password))
      - task: build-image
        privileged: true
        file: ci-images-git-repo/ci/tasks/build-oci-image.yml
        input_mapping:
          git-repo: ci-images-git-repo
        params:
          CONTEXT: git-repo/ci/images/app-broker-ci
      - put: app-broker-ci-image
        inputs: detect
        params:
          image: image/image.tar
        no_get: true

  - name: build
    serial: true
    public: true
    plan:
      - get: nightly
        trigger: true
      - get: git-repo
        trigger: true
      - task: build-project
        timeout: 1h30m
        file: git-repo/ci/tasks/build-project.yml
        vars:
          ci-image-tag: ((ci-image-tag))
      - put: artifactory-repo
        params: &artifactory-params
          signing_key: ((signing-key))
          signing_passphrase: ((signing-passphrase))
          repo: libs-snapshot-local
          folder: distribution-repository
          build_uri: "${ATC_EXTERNAL_URL}/builds/${BUILD_ID}"
          build_number: "${BUILD_PIPELINE_NAME}-((branch))-${BUILD_JOB_NAME}-${BUILD_NAME}"
          disable_checksum_uploads: true
          artifact_set:
            - include:
                - /**/*.zip
              properties:
                zip.name: spring-cloud-app-broker
                zip.displayname: Spring Cloud App Broker
                zip.deployed: false
            - include:
                - /**/*-docs.zip
              properties:
                zip.type: docs

  - name: run-acceptance-tests
    serial: true
    plan:
      - in_parallel:
          - get: nightly
            passed: [build]
            trigger: true
          - get: git-repo
            passed: [build]
            trigger: true
          - put: cf-environment
            params:
              action: create
              duration: 6h
              resource: cf-environment
            timeout: 6h
      - task: acceptance-tests
        file: git-repo/ci/tasks/acceptance-tests.yml
        vars:
          ci-image-tag: ((ci-image-tag))
    on_success:
      in_parallel:
        - put: cf-environment
          params:
            action: release
            resource: cf-environment

  - name: stage-milestone
    serial: true
    plan:
      - get: git-repo
        passed: [run-acceptance-tests]
      - task: stage
        file: git-repo/ci/tasks/stage.yml
        vars:
          release-type: M
          ci-image-tag: ((ci-image-tag))
      - put: artifactory-repo
        params:
          <<: *artifactory-params
          repo: libs-staging-local
      - put: git-repo-staging
        params:
          repository: stage-git-repo

  - name: stage-rc
    serial: true
    plan:
      - get: git-repo
        passed: [run-acceptance-tests]
      - task: stage
        file: git-repo/ci/tasks/stage.yml
        vars:
          release-type: RC
          ci-image-tag: ((ci-image-tag))
      - put: artifactory-repo
        params:
          <<: *artifactory-params
          repo: libs-staging-local
      - put: git-repo-staging
        params:
          repository: stage-git-repo

  - name: stage-release
    serial: true
    plan:
      - get: git-repo
        passed: [run-acceptance-tests]
      - task: stage
        file: git-repo/ci/tasks/stage.yml
        vars:
          release-type: RELEASE
          ci-image-tag: ((ci-image-tag))
      - put: artifactory-repo
        params:
          <<: *artifactory-params
          repo: libs-staging-local
      - put: git-repo-staging
        params:
          repository: stage-git-repo

  - name: promote-milestone
    serial: true
    plan:
      - get: git-repo
      - get: artifactory-repo
        passed: [stage-milestone]
        params:
          save_build_info: true
      - task: promote
        file: git-repo/ci/tasks/promote.yml
        vars:
          release-type: M

  - name: promote-rc
    serial: true
    plan:
      - in_parallel:
          - get: git-repo
          - get: artifactory-repo
            passed: [stage-rc]
            params:
              save_build_info: true
      - task: promote
        file: git-repo/ci/tasks/promote.yml
        vars:
          release-type: RC

  - name: promote-release
    serial: true
    plan:
      - in_parallel:
          - get: git-repo
          - get: artifactory-repo
            passed: [stage-release]
            params:
              save_build_info: true
      - task: promote
        file: git-repo/ci/tasks/promote.yml
        vars:
          release-type: RELEASE

  - name: sync-to-maven-central
    serial: true
    plan:
      - in_parallel:
          - get: git-repo
          - get: artifactory-repo
            passed: [promote-release]
            params:
              save_build_info: true
      - task: sync-to-maven-central
        file: git-repo/ci/tasks/sync-to-maven-central.yml

resource_types:
  - name: artifactory-resource
    type: registry-image
    source:
      repository: ((app-broker-virtual-docker-registry))/springio/artifactory-resource
      username: ((broadcom-jfrog-artifactory-robot-account.username))
      password: ((broadcom-jfrog-artifactory-robot-account.password))
      tag: 0.0.14

  - name: shepherd
    type: registry-image
    source:
      repository: ((shepherd-image-repository))/shepherd/concourse-resource
      tag: v1

resources:
  - name: nightly
    type: time
    icon: calendar-clock
    source:
      start: 12:00 AM
      stop: 1:00 AM
      days:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
      location: America/New_York
      initial_version: true

  - name: weekly
    type: time
    icon: calendar-clock
    source:
      start: 12:00 AM
      stop: 1:00 AM
      days:
        - Monday
      location: America/New_York
      initial_version: true

  - name: git-repo
    type: git
    source:
      uri: ((github-repo))
      username: ((github-token))
      password: ((github-password))
      branch: ((branch))
      ignore_paths: ["ci/images/*"]
      fetch_tags: true

  - name: git-repo-staging
    type: git
    source:
      uri: ((github-repo))
      username: ((github-token))
      password: ((github-password))
      branch: ((github-username))/staging

  - name: ci-images-git-repo
    type: git
    source:
      uri: ((github-repo))
      branch: ((branch))
      paths:
        - ci/images/*
        - ci/scripts/generate-docker-credentials.sh
        - ci/tasks/build-oci-image.yml
        - ci/tasks/generate-docker-credentials.yml

  - name: app-broker-ci-image
    type: registry-image
    source:
      repository: ((app-broker-dev-docker-registry))/ci/app-broker-ci
      username: ((broadcom-jfrog-artifactory-robot-account.username))
      password: ((broadcom-jfrog-artifactory-robot-account.password))
      tag: ((ci-image-tag))

  - name: artifactory-repo
    type: artifactory-resource
    source:
      uri: ((artifactory-server))
      username: ((artifactory-username))
      password: ((artifactory-password))
      build_name: ((build-name))

  - name: cf-environment
    type: shepherd
    source:
      url: ((shepherd-url))
      service-account-key: ((shepherd-service-account-key))
      lease:
        namespace: spring-cloud-app-broker
        pool:
          namespace: spring-cloud-app-broker
          name: cfd
      compatibility-mode: environments-app

groups:
  - name: "build"
    jobs:
      - build
      - run-acceptance-tests
  - name: "milestone"
    jobs:
      - stage-milestone
      - promote-milestone
  - name: "rc"
    jobs:
      - stage-rc
      - promote-rc
  - name: "release"
    jobs:
      - stage-release
      - promote-release
      - sync-to-maven-central
  - name: "ci-images"
    jobs:
      - build-ci-images
  - name: "all"
    jobs:
      - build
      - run-acceptance-tests
      - stage-milestone
      - promote-milestone
      - stage-rc
      - promote-rc
      - stage-release
      - promote-release
      - sync-to-maven-central
      - build-ci-images
